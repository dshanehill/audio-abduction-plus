<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- background: deep night sky -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset="1" stop-color="#090d24"/>
    </linearGradient>
    <!-- tractor beam -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </linearGradient>
    <!-- alien skin: lit from upper left -->
    <radialGradient id="skin" cx="0.38" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#e4e8ee"/>
      <stop offset="0.35" stop-color="#b3b9c3"/>
      <stop offset="0.75" stop-color="#7c838f"/>
      <stop offset="1" stop-color="#4e545e"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <!-- glossy black eyes -->
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="0.6" stop-color="#0b0d13"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <!-- headphone plastic -->
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4b52"/>
      <stop offset="0.45" stop-color="#1c1d22"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="cupR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3b42"/>
      <stop offset="0.45" stop-color="#18191d"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3e45"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#1e7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- stars -->
    <g fill="#fff">
      <circle cx="140" cy="150" r="5" opacity="0.8"/>
      <circle cx="880" cy="120" r="4" opacity="0.7"/>
      <circle cx="905" cy="300" r="3" opacity="0.5"/>
      <circle cx="95" cy="380" r="3" opacity="0.5"/>
      <circle cx="210" cy="90" r="3" opacity="0.6"/>
      <circle cx="800" cy="210" r="2.5" opacity="0.6"/>
    </g>
    <!-- beam behind the alien -->
    <path d="M412 0 L612 0 L960 1024 L64 1024 Z" fill="url(#beam)"/>
    <!-- ground glow -->
    <ellipse cx="512" cy="960" rx="300" ry="50" fill="#7dffb0" opacity="0.25" filter="url(#soft)"/>
  </g>

  <g filter="url(#drop)">
    <!-- headband (behind head top) -->
    <path d="M232 520 C196 30 828 30 792 520" fill="none" stroke="url(#band)" stroke-width="54" stroke-linecap="round"/>
    <path d="M250 380 C250 120 774 120 774 380" fill="none" stroke="#6a6b73" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- head -->
    <path id="head" d="M512 200 C716 200 792 336 782 476 C772 604 636 760 558 838 C534 862 490 862 466 838 C388 760 252 604 242 476 C232 336 308 200 512 200 Z" fill="url(#skin)"/>
    <path d="M512 200 C716 200 792 336 782 476 C772 604 636 760 558 838 C534 862 490 862 466 838 C388 760 252 604 242 476 C232 336 308 200 512 200 Z" fill="url(#rim)"/>
    <!-- forehead sheen -->
    <ellipse cx="440" cy="300" rx="120" ry="58" fill="#fff" opacity="0.28" transform="rotate(-18 440 300)"/>

    <!-- eyes -->
    <g>
      <ellipse cx="408" cy="528" rx="104" ry="52" transform="rotate(32 408 528)" fill="url(#eye)"/>
      <ellipse cx="616" cy="528" rx="104" ry="52" transform="rotate(-32 616 528)" fill="url(#eye)"/>
      <ellipse cx="380" cy="500" rx="30" ry="13" transform="rotate(32 380 500)" fill="#fff" opacity="0.85"/>
      <ellipse cx="590" cy="498" rx="30" ry="13" transform="rotate(-32 590 498)" fill="#fff" opacity="0.85"/>
      <circle cx="440" cy="556" r="7" fill="#fff" opacity="0.4"/>
      <circle cx="648" cy="556" r="7" fill="#fff" opacity="0.4"/>
    </g>
    <!-- nostrils and mouth -->
    <ellipse cx="500" cy="680" rx="6" ry="4" fill="#4b515b"/>
    <ellipse cx="524" cy="680" rx="6" ry="4" fill="#4b515b"/>
    <path d="M478 748 Q512 760 546 748" fill="none" stroke="#4b515b" stroke-width="7" stroke-linecap="round"/>

    <!-- left ear cup -->
    <g>
      <rect x="168" y="402" width="118" height="232" rx="56" fill="url(#cup)"/>
      <rect x="258" y="420" width="44" height="196" rx="22" fill="#111216"/>
      <rect x="186" y="420" width="22" height="120" rx="11" fill="#fff" opacity="0.18"/>
      <!-- bluetooth mark -->
      <path d="M216 482 L252 512 L230 530 L230 470 L252 488 L216 518" fill="none" stroke="#c9ccd3" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
    </g>
    <!-- right ear cup -->
    <g>
      <rect x="738" y="402" width="118" height="232" rx="56" fill="url(#cupR)"/>
      <rect x="722" y="420" width="44" height="196" rx="22" fill="#111216"/>
      <rect x="816" y="420" width="18" height="110" rx="9" fill="#fff" opacity="0.12"/>
      <!-- blue status LED -->
      <circle cx="797" cy="590" r="34" fill="url(#led)"/>
      <circle cx="797" cy="590" r="8" fill="#e8f7ff"/>
    </g>
  </g>
</svg>
